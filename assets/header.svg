<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Hi, I'm Engy Refaai - AI Engineer and Data Analyst" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- banner gradient (from the SVG header) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA8C8"/>
      <stop offset="0.5" stop-color="#F26A9E"/>
      <stop offset="1" stop-color="#B57BC9"/>
    </linearGradient>
    <!-- pastel card gradient (from the HTML header) -->
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0F5"/>
      <stop offset="1" stop-color="#E6E6FA"/>
    </linearGradient>
    <clipPath id="cardClip"><rect width="800" height="300" rx="20"/></clipPath>
    <clipPath id="shape"><path d="M0,0 H800 V172 Q700,205 600,180 T400,172 T200,172 T0,172 Z"/></clipPath>
    <clipPath id="reveal">
      <rect x="60" y="30" height="110" width="0">
        <animate attributeName="width" values="0;660;660;660" keyTimes="0;0.4;0.92;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- sparkle -->
    <path id="spark" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#FFFFFF"/>
    <!-- cherry blossom -->
    <g id="blossom">
      <g fill="#FFB6C1" stroke="#F26A9E" stroke-width="0.6">
        <ellipse cx="0" cy="-5" rx="3.2" ry="4.5"/>
        <ellipse cx="0" cy="-5" rx="3.2" ry="4.5" transform="rotate(72)"/>
        <ellipse cx="0" cy="-5" rx="3.2" ry="4.5" transform="rotate(144)"/>
        <ellipse cx="0" cy="-5" rx="3.2" ry="4.5" transform="rotate(216)"/>
        <ellipse cx="0" cy="-5" rx="3.2" ry="4.5" transform="rotate(288)"/>
      </g>
      <circle r="2" fill="#FFFACD"/>
    </g>
    <!-- butterfly wing (right side) -->
    <g id="wing">
      <path d="M0,-2 C10,-30 38,-32 35,-10 C33,3 12,5 0,0 Z" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFD1DC" stroke-width="1.5"/>
      <path d="M0,1 C14,3 31,9 25,25 C19,33 6,23 0,7 Z" fill="#FFD1DC" fill-opacity="0.95" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="22" cy="-13" r="5" fill="#B57BC9" fill-opacity="0.55"/>
      <circle cx="14" cy="14" r="3" fill="#F26A9E" fill-opacity="0.6"/>
    </g>
  </defs>

  <!-- Card -->
  <g clip-path="url(#cardClip)">
    <rect width="800" height="300" fill="url(#card)"/>

    <!-- Wave banner -->
    <path d="M0,0 H800 V172 Q700,205 600,180 T400,172 T200,172 T0,172 Z" fill="url(#bg)"/>
    <g clip-path="url(#shape)">
      <path d="M-800,150 Q-600,122 -400,150 T-200,150 T0,150 T200,150 T400,150 T600,150 T800,150 T1000,150 T1200,150 T1400,150 T1600,150 V260 H-800 Z" fill="#7A2A56" opacity="0.28"><animateTransform attributeName="transform" type="translate" values="0,0;-400,0" dur="9s" repeatCount="indefinite"/></path>
      <path d="M-800,162 Q-600,142 -400,162 T-200,162 T0,162 T200,162 T400,162 T600,162 T800,162 T1000,162 T1200,162 T1400,162 T1600,162 V260 H-800 Z" fill="#FFFFFF" opacity="0.14"><animateTransform attributeName="transform" type="translate" values="0,0;-400,0" dur="6s" repeatCount="indefinite"/></path>
    </g>

    <!-- Sparkles -->
    <use href="#spark" x="60" y="48" opacity="0.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></use>
    <use href="#spark" x="765" y="30" opacity="0.8" transform="scale(0.7)" ><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></use>
    <use href="#spark" x="690" y="130" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></use>

    <!-- Title: typed -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.92;0.97;1" dur="12s" repeatCount="indefinite"/>
      <g clip-path="url(#reveal)">
        <text x="105" y="108" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="50" font-weight="700" fill="#FFFFFF" textLength="560" lengthAdjust="spacing">Hi, I'm Engy Refaai</text>
      </g>
    </g>

    <!-- Butterfly -->
    <g transform="translate(728,78)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="3s" repeatCount="indefinite"/>
        <g transform="rotate(12)">
          <g><animateTransform attributeName="transform" type="scale" values="1 1;0.3 1;1 1" dur="1.1s" repeatCount="indefinite"/><use href="#wing"/></g>
          <g transform="scale(-1,1)"><g><animateTransform attributeName="transform" type="scale" values="1 1;0.3 1;1 1" dur="1.1s" repeatCount="indefinite"/><use href="#wing"/></g></g>
          <ellipse cx="0" cy="3" rx="2.6" ry="14" fill="#6B4C70"/>
          <path d="M0,-10 Q-6,-24 -11,-26 M0,-10 Q6,-24 11,-26" stroke="#6B4C70" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- Subtitle -->
    <text x="400" y="218" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="24" font-weight="700" fill="#6B4C70" opacity="0">
      AI Engineer &amp; Data Analyst
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.52;0.92;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- Git command -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.6;0.92;0.97;1" dur="12s" repeatCount="indefinite"/>
      <rect x="202" y="238" width="396" height="36" rx="8" fill="#6B4C70"/>
      <text x="222" y="261" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="700" textLength="356" lengthAdjust="spacing"><tspan fill="#FFFACD">$ </tspan><tspan fill="#FFB6C1">git commit</tspan><tspan fill="#FFFFFF"> -m </tspan><tspan fill="#FFD1DC">"made it smarter"</tspan></text>
      <rect x="584" y="247" width="8" height="18" fill="#FFFACD"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></rect>
    </g>
    </g>

  <!-- Border -->
  <rect x="1" y="1" width="798" height="298" rx="20" fill="none" stroke="#FFD1DC" stroke-width="2"/>
</svg>
